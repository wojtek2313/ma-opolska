<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Małopolska Razem – klikalny mock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0C}
a{color:#D4FF4F}a:hover{color:#E6FF8F}
button,input,textarea{font-family:'Archivo',system-ui,sans-serif}
.scroll{scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 14px;border-radius:999px;border:1px solid #34343A;background:transparent;color:#F4F4F0;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;min-height:38px}
.chip-on{background:#D4FF4F;color:#0B0B0C;border-color:#D4FF4F}
.card{background:#161618;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#A3A39C}
.btn{min-height:48px;border-radius:999px;border:0;font-weight:700;font-size:15px;cursor:pointer;padding:0 20px}
.btn-pri{background:#D4FF4F;color:#0B0B0C}
.btn-sec{background:#26262A;color:#F4F4F0}
.btn-done{background:transparent;color:#D4FF4F;border:1.5px solid #D4FF4F}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;cursor:pointer;font-size:11px;font-weight:600;padding:10px 0;min-height:56px}
.field{width:100%;box-sizing:border-box;background:#0B0B0C;border:1px solid #34343A;border-radius:14px;color:#F4F4F0;font-size:15px;padding:12px 14px}
.field:focus{outline:2px solid #D4FF4F;outline-offset:1px}
button:focus-visible{outline:2px solid #D4FF4F;outline-offset:2px}
</style>

<style>
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#050506;overflow:hidden}
#phone{width:390px;height:844px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px #26262A,0 30px 80px rgba(0,0,0,.6);transform-origin:center center;flex-shrink:0}
</style>
</head>
<body>
<div id="phone"><div id="app"></div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0C; color: #F4F4F0; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; top: 16px; left: 16px; right: 16px; z-index: 20; background: #F4F4F0; color: #0B0B0C; border-radius: 16px; padding: 14px 16px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.4)">{{toast}}</div>
</sc-if>

<sc-if value="{{showTopBar}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px">
<div style="font-weight: 800; font-size: 21px; letter-spacing: -0.02em">MAŁOPOLSKA<span style="color: #D4FF4F">.</span>RAZEM</div>
<div style="display: flex; align-items: center; gap: 6px; background: #161618; border-radius: 999px; padding: 8px 12px; font-weight: 700; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4FF4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3 6.5 7 1-5 4.8 1.2 7-6.2-3.3-6.2 3.3L7 14.3 2 9.5l7-1z"></path></svg>
<span style="white-space: nowrap">{{points}} pkt</span>
</div>
</div>
</sc-if>

<div class="scroll" ref="{{scrollRef}}" onScroll="{{onScroll}}" style="flex-grow: 1; overflow-y: auto; overflow-x: hidden">

<!-- ODKRYWAJ -->
<sc-if value="{{showFeed}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; padding-bottom: 24px">
<div style="margin: 4px 12px 0; border-radius: 28px; background: {{hero.bg}}; color: #0B0B0C; overflow: hidden; position: relative">
<button onClick="{{openPicker}}" aria-haspopup="dialog" aria-label="Zmień gminę, obecnie {{gminaLabel}}" style="width: 100%; background: transparent; border: 0; padding: 20px 20px 0; color: #0B0B0C; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Twoja okolica · zmień</span>
<span style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">{{gminaLabel}}</span>
<span style="width: 40px; height: 40px; border-radius: 999px; background: #0B0B0C; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{hero.bg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
</span>
<span style="font-size: 13px; font-weight: 600">{{gminaSub}}</span>
</button>
<div style="position: relative; margin-top: 8px">
<sc-if value="{{hero.isRatusz}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 390 190" width="100%" height="190" role="img" aria-label="Ilustracja: rynek i ratusz" style="display: block"><rect x="0" y="184" width="390" height="6" fill="#0B0B0C"></rect><polygon points="20,190 20,130 55,105 90,130 90,190" fill="#0B0B0C"></polygon><polygon points="300,190 300,135 335,110 370,135 370,190" fill="#0B0B0C"></polygon><rect x="110" y="120" width="170" height="70" fill="#0B0B0C"></rect><polygon points="100,122 195,82 290,122" fill="#0B0B0C"></polygon><rect x="178" y="40" width="34" height="85" fill="#0B0B0C"></rect><polygon points="172,42 195,4 218,42" fill="#0B0B0C"></polygon><circle cx="195" cy="66" r="9" fill="{{hero.bg}}"></circle><path d="M195 66V60M195 66h5" stroke="#0B0B0C" stroke-width="2" fill="none"></path><rect x="128" y="138" width="14" height="20" fill="{{hero.bg}}"></rect><rect x="156" y="138" width="14" height="20" fill="{{hero.bg}}"></rect><rect x="220" y="138" width="14" height="20" fill="{{hero.bg}}"></rect><rect x="248" y="138" width="14" height="20" fill="{{hero.bg}}"></rect><path d="M184 190v-24a11 11 0 0 1 22 0v24z" fill="{{hero.bg}}"></path><rect x="40" y="145" width="12" height="14" fill="{{hero.bg}}"></rect><rect x="66" y="145" width="12" height="14" fill="{{hero.bg}}"></rect><rect x="318" y="150" width="12" height="14" fill="{{hero.bg}}"></rect><rect x="342" y="150" width="12" height="14" fill="{{hero.bg}}"></rect></svg>
</sc-if>
<sc-if value="{{hero.isKopalnia}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 390 190" width="100%" height="190" role="img" aria-label="Ilustracja: szyb kopalni soli" style="display: block"><rect x="0" y="184" width="390" height="6" fill="#0B0B0C"></rect><path d="M195 40L268 142" stroke="#0B0B0C" stroke-width="8" fill="none" stroke-linecap="round"></path><path d="M150 142L195 40L240 142" stroke="#0B0B0C" stroke-width="10" fill="none" stroke-linejoin="round"></path><path d="M163 112h64M174 86h42" stroke="#0B0B0C" stroke-width="6" fill="none"></path><circle cx="195" cy="40" r="26" fill="none" stroke="#0B0B0C" stroke-width="8"></circle><path d="M195 14v52M169 40h52" stroke="#0B0B0C" stroke-width="4" fill="none"></path><rect x="70" y="140" width="250" height="50" fill="#0B0B0C"></rect><polygon points="62,142 195,118 328,142" fill="#0B0B0C"></polygon><rect x="92" y="154" width="16" height="22" fill="{{hero.bg}}"></rect><rect x="124" y="154" width="16" height="22" fill="{{hero.bg}}"></rect><rect x="250" y="154" width="16" height="22" fill="{{hero.bg}}"></rect><rect x="282" y="154" width="16" height="22" fill="{{hero.bg}}"></rect><path d="M183 190v-26a12 12 0 0 1 24 0v26z" fill="{{hero.bg}}"></path><rect x="332" y="158" width="44" height="32" fill="#0B0B0C"></rect><polygon points="328,160 354,144 380,160" fill="#0B0B0C"></polygon></svg>
</sc-if>
<sc-if value="{{hero.isGory}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 390 190" width="100%" height="190" role="img" aria-label="Ilustracja: góry" style="display: block"><polygon points="0,190 0,120 60,70 110,110 175,20 240,95 290,60 350,110 390,85 390,190" fill="#0B0B0C"></polygon><polygon points="175,20 160,42 168,40 175,48 183,38 192,44" fill="#F4F4F0"></polygon><polygon points="290,60 280,74 288,72 294,78 300,70" fill="#F4F4F0"></polygon><polygon points="60,70 50,82 58,80 64,86 70,80" fill="#F4F4F0"></polygon><path d="M0 190 Q100 138 200 168 T390 158 V190z" fill="{{hero.bg}}"></path><rect x="70" y="160" width="40" height="30" fill="#0B0B0C"></rect><polygon points="64,162 90,140 116,162" fill="#0B0B0C"></polygon><rect x="84" y="172" width="10" height="18" fill="{{hero.bg}}"></rect><polygon points="300,186 312,150 324,186" fill="#0B0B0C"></polygon><polygon points="322,186 336,140 350,186" fill="#0B0B0C"></polygon></svg>
</sc-if>
<sc-if value="{{hero.isTarnow}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 390 190" width="100%" height="190" role="img" aria-label="Ilustracja: renesansowy ratusz" style="display: block"><rect x="0" y="184" width="390" height="6" fill="#0B0B0C"></rect><rect x="100" y="105" width="190" height="85" fill="#0B0B0C"></rect><rect x="100" y="89" width="14" height="16" fill="#0B0B0C"></rect><rect x="124" y="89" width="14" height="16" fill="#0B0B0C"></rect><rect x="148" y="89" width="14" height="16" fill="#0B0B0C"></rect><rect x="172" y="89" width="14" height="16" fill="#0B0B0C"></rect><rect x="196" y="89" width="14" height="16" fill="#0B0B0C"></rect><rect x="220" y="89" width="14" height="16" fill="#0B0B0C"></rect><rect x="244" y="89" width="14" height="16" fill="#0B0B0C"></rect><rect x="268" y="89" width="14" height="16" fill="#0B0B0C"></rect><rect x="180" y="30" width="30" height="75" fill="#0B0B0C"></rect><path d="M176 32Q195 0 214 32z" fill="#0B0B0C"></path><rect x="192" y="0" width="6" height="10" fill="#0B0B0C"></rect><path d="M115 190v-22a12 12 0 0 1 24 0v22z" fill="{{hero.bg}}"></path><path d="M150 190v-22a12 12 0 0 1 24 0v22z" fill="{{hero.bg}}"></path><path d="M183 190v-22a12 12 0 0 1 24 0v22z" fill="{{hero.bg}}"></path><path d="M218 190v-22a12 12 0 0 1 24 0v22z" fill="{{hero.bg}}"></path><path d="M253 190v-22a12 12 0 0 1 24 0v22z" fill="{{hero.bg}}"></path><rect x="122" y="120" width="12" height="18" fill="{{hero.bg}}"></rect><rect x="157" y="120" width="12" height="18" fill="{{hero.bg}}"></rect><rect x="226" y="120" width="12" height="18" fill="{{hero.bg}}"></rect><rect x="261" y="120" width="12" height="18" fill="{{hero.bg}}"></rect></svg>
</sc-if>
<sc-if value="{{hero.isKrakow}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 390 190" width="100%" height="190" role="img" aria-label="Ilustracja: Rynek Główny" style="display: block"><rect x="0" y="184" width="390" height="6" fill="#0B0B0C"></rect><rect x="0" y="150" width="100" height="40" fill="#0B0B0C"></rect><polygon points="0,152 25,132 50,152" fill="#0B0B0C"></polygon><polygon points="50,152 75,128 100,152" fill="#0B0B0C"></polygon><rect x="140" y="120" width="90" height="70" fill="#0B0B0C"></rect><polygon points="136,122 185,96 234,122" fill="#0B0B0C"></polygon><rect x="110" y="50" width="32" height="140" fill="#0B0B0C"></rect><polygon points="106,52 126,0 146,52" fill="#0B0B0C"></polygon><polygon points="104,62 108,44 112,62" fill="#0B0B0C"></polygon><polygon points="140,62 144,44 148,62" fill="#0B0B0C"></polygon><rect x="160" y="80" width="26" height="110" fill="#0B0B0C"></rect><path d="M156 82Q173 50 190 82z" fill="#0B0B0C"></path><path d="M120 92v-14a6 6 0 0 1 12 0v14z" fill="{{hero.bg}}"></path><path d="M167 112v-12a6 6 0 0 1 12 0v12z" fill="{{hero.bg}}"></path><rect x="240" y="140" width="145" height="50" fill="#0B0B0C"></rect><rect x="244" y="128" width="10" height="12" fill="#0B0B0C"></rect><rect x="262" y="128" width="10" height="12" fill="#0B0B0C"></rect><rect x="280" y="128" width="10" height="12" fill="#0B0B0C"></rect><rect x="298" y="128" width="10" height="12" fill="#0B0B0C"></rect><rect x="316" y="128" width="10" height="12" fill="#0B0B0C"></rect><rect x="334" y="128" width="10" height="12" fill="#0B0B0C"></rect><rect x="352" y="128" width="10" height="12" fill="#0B0B0C"></rect><rect x="370" y="128" width="10" height="12" fill="#0B0B0C"></rect><path d="M252 190v-18a10 10 0 0 1 20 0v18z" fill="{{hero.bg}}"></path><path d="M282 190v-18a10 10 0 0 1 20 0v18z" fill="{{hero.bg}}"></path><path d="M312 190v-18a10 10 0 0 1 20 0v18z" fill="{{hero.bg}}"></path><path d="M342 190v-18a10 10 0 0 1 20 0v18z" fill="{{hero.bg}}"></path><rect x="14" y="160" width="8" height="10" fill="{{hero.bg}}"></rect><rect x="36" y="160" width="8" height="10" fill="{{hero.bg}}"></rect><rect x="62" y="160" width="8" height="10" fill="{{hero.bg}}"></rect><rect x="84" y="160" width="8" height="10" fill="{{hero.bg}}"></rect></svg>
</sc-if>
<sc-if value="{{hero.isRegion}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 390 190" width="100%" height="190" role="img" aria-label="Ilustracja: krajobraz Małopolski" style="display: block"><polygon points="0,190 0,110 50,80 90,105 140,50 185,95 230,70 280,100 330,60 390,95 390,190" fill="#0B0B0C"></polygon><polygon points="140,50 130,64 138,62 144,68 150,60" fill="#F4F4F0"></polygon><polygon points="330,60 321,72 328,70 334,76 340,68" fill="#F4F4F0"></polygon><path d="M0 190 Q90 128 190 160 T390 150 V190z" fill="{{hero.bg}}"></path><rect x="170" y="132" width="44" height="44" fill="#0B0B0C"></rect><rect x="186" y="104" width="12" height="30" fill="#0B0B0C"></rect><polygon points="182,106 192,84 202,106" fill="#0B0B0C"></polygon><rect x="186" y="154" width="12" height="22" fill="{{hero.bg}}"></rect><polygon points="60,182 72,146 84,182" fill="#0B0B0C"></polygon><polygon points="300,176 314,136 328,176" fill="#0B0B0C"></polygon><polygon points="324,178 336,148 348,178" fill="#0B0B0C"></polygon></svg>
</sc-if>
<span style="position: absolute; right: 12px; bottom: 14px; background: #0B0B0C; color: #F4F4F0; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 5px 10px">{{hero.caption}}</span>
</div>
</div>
<div style="position: sticky; top: 0; z-index: 5; background: #0B0B0C; padding: 14px 0 12px; border-bottom: 1px solid {{stickyBorder}}">
<div class="scroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 0 16px; align-items: center">
<sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}">
<button onClick="{{openPicker}}" aria-label="Zmień gminę, obecnie {{gminaLabel}}" style="flex-shrink: 0; display: flex; align-items: center; gap: 6px; background: {{hero.bg}}; color: #0B0B0C; border: 0; border-radius: 999px; padding: 9px 12px; font-weight: 700; font-size: 13px; cursor: pointer; min-height: 38px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path></svg>{{gminaLabel}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="width: 1px; height: 24px; background: #34343A; flex-shrink: 0"></span>
</sc-if>
<sc-for list="{{typy}}" as="t" hint-placeholder-count="5">
<button class="{{t.cls}}" onClick="{{t.pick}}">{{t.name}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding-top: 4px">
<div style="padding: 0 20px; font-size: 13px; color: #A3A39C">{{feedCount}}</div>
<sc-if value="{{feedEmpty}}" hint-placeholder-val="{{ false }}">
<div class="card" style="margin: 0 20px; align-items: flex-start">
<div style="font-weight: 700; font-size: 17px">Tu jeszcze cisza</div>
<div style="font-size: 14px; color: #A3A39C">Bądź pierwszą osobą, która coś zgłosi albo zorganizuje w tej gminie.</div>
<button class="btn btn-pri" onClick="{{goAdd}}">Dodaj aktywność</button>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 28px; padding: 0 16px">
<sc-for list="{{feed}}" as="f" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="height: 156px; border-radius: 22px; background: {{f.color}}; color: #0B0B0C; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1.5px solid #0B0B0C; border-radius: 999px; padding: 5px 10px">{{f.kindLabel}}</span>
<span style="font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 4px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0B0B0C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{f.gmina}}</span>
</div>
<div>
<div style="font-weight: 800; font-size: 42px; line-height: 1; letter-spacing: -0.03em">{{f.big}}</div>
<div style="font-weight: 600; font-size: 13px; margin-top: 6px">{{f.bigSub}}</div>
</div>
</div>
<div style="padding: 0 4px; display: flex; flex-direction: column; gap: 4px">
<div style="font-weight: 700; font-size: 18px; line-height: 1.25">{{f.title}}</div>
<div style="font-size: 13px; color: #A3A39C">{{f.meta}}</div>
</div>
<div style="display: flex; gap: 8px; padding: 0 4px">
<button class="{{f.ctaCls}}" style="flex-grow: 1" onClick="{{f.cta}}">{{f.ctaLabel}}</button>
<sc-if value="{{f.hasSecond}}" hint-placeholder-val="{{ false }}">
<button class="btn btn-pri" onClick="{{f.second}}">{{f.secondLabel}}</button>
</sc-if>
</div>
</div>
</sc-for>
</div>
</div>
</div>
</sc-if>

<!-- DODAJ -->
<sc-if value="{{showAdd}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 24px">
<h1 style="margin: 0; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em">Co chcesz<br>zmienić?</h1>
<div style="display: flex; gap: 8px">
<button class="{{rodzajFormCls}}" onClick="{{pickFormalne}}">Zgłoszenie do instytucji</button>
<button class="{{rodzajOddCls}}" onClick="{{pickOddolne}}">Zgłoszenie społeczne</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="lbl">Gdzie</div>
<button onClick="{{openAddPicker}}" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 10px; background: #161618; border: 1px solid {{addBorder}}; border-radius: 14px; padding: 12px 14px; color: #F4F4F0; cursor: pointer; min-height: 48px; text-align: left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4FF4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
<span style="flex-grow: 1; font-size: 15px; font-weight: 700">{{addGmina}}</span>
<span style="font-size: 12px; color: #A3A39C">{{addGminaNote}}</span>
</button>
<sc-if value="{{addBlocked}}" hint-placeholder-val="{{ false }}">
<div style="background: #33270F; border: 1px solid #F2B84B; border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: flex-start">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2B84B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 700; font-size: 14px; color: #F7D28C">Nie możesz dodawać w gminie {{addGmina}}</div>
<div style="font-size: 13px; line-height: 1.4">Jesteś mieszkanką gminy {{home}}. Tutaj możesz przeglądać zgłoszenia, dołączać do wydarzeń i pomagać. Punkty za pomoc trafią do Twojej gminy.</div>
<button class="chip" style="align-self: flex-start" onClick="{{resetAddGmina}}">Wróć do gminy {{home}}</button>
</div>
</div>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label class="lbl" for="opis">Opisz własnymi słowami</label>
<textarea id="opis" class="field" rows="5" style="resize: none; line-height: 1.4" value="{{addText}}" onChange="{{onAddText}}"></textarea>
</div>
<div style="display: flex; gap: 8px">

<script>
(function(){
  class DCLogic {
    constructor(){ this.props = {}; }
    setState(p){ const v = typeof p === 'function' ? p(this.state, this.props) : p; this.state = Object.assign({}, this.state, v); schedule(); }
    forceUpdate(){ schedule(); }
  }
  window.DCLogic = DCLogic;
  let comp, pending = false;
  function schedule(){ if (pending) return; pending = true; queueMicrotask(() => { pending = false; render(); }); }
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function look(path, scope){
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    const parts = path.split('.'); let v = scope[parts[0]];
    for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  const str = (v) => v == null ? '' : String(v);
  const EV = { onclick: 'click', onchange: 'input', onscroll: 'scroll', oninput: 'input', onkeydown: 'keydown' };
  function build(node, scope, out){
    if (node.nodeType === 3) { out.push(document.createTextNode(node.nodeValue.replace(HOLE, (_, p) => str(look(p, scope))))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-if') {
      const m = WHOLE.exec(node.getAttribute('value') || '');
      if (m && look(m[1], scope)) node.childNodes.forEach((c) => build(c, scope, out));
      return;
    }
    if (tag === 'sc-for') {
      const m = WHOLE.exec(node.getAttribute('list') || ''); const as = node.getAttribute('as') || 'item';
      const list = (m && look(m[1], scope)) || [];
      list.forEach((item, i) => { const s2 = Object.create(scope); s2[as] = item; s2.$index = i; node.childNodes.forEach((c) => build(c, s2, out)); });
      return;
    }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, node.localName) : document.createElement(tag);
    for (const a of Array.from(node.attributes)) {
      const n = a.name, val = a.value;
      if (n.startsWith('hint-')) continue;
      const whole = WHOLE.exec(val);
      if (EV[n]) { const fn = whole && look(whole[1], scope); if (typeof fn === 'function') el.addEventListener(EV[n], (e) => fn(e)); continue; }
      if (n === 'ref') { const fn = whole && look(whole[1], scope); if (typeof fn === 'function') fn(el); continue; }
      if (n === 'value') { el.value = whole ? str(look(whole[1], scope)) : val.replace(HOLE, (_, p) => str(look(p, scope))); continue; }
      el.setAttribute(n, whole ? str(look(whole[1], scope)) : val.replace(HOLE, (_, p) => str(look(p, scope))));
    }
    const kids = []; (node.content || node).childNodes.forEach((c) => build(c, scope, kids));
    kids.forEach((k) => el.appendChild(k));
    if (tag === 'textarea') { el.value = el.getAttribute('value') || el.value; }
    out.push(el);
  }
  let tpl, mount;
  function render(){
    const active = document.activeElement; const fid = active && active.id; let sel = null;
    if (fid && active.selectionStart != null) sel = [active.selectionStart, active.selectionEnd];
    const scrolls = Array.from(mount.querySelectorAll('.scroll')).map((e) => [e.scrollTop, e.scrollLeft]);
    const vals = comp.renderVals(); const out = [];
    tpl.content.childNodes.forEach((c) => build(c, vals, out));
    mount.replaceChildren(...out);
    Array.from(mount.querySelectorAll('.scroll')).forEach((e, i) => { if (scrolls[i]) { e.scrollTop = scrolls[i][0]; e.scrollLeft = scrolls[i][1]; } });
    if (fid) { const f = document.getElementById(fid); if (f) { f.focus(); if (sel && f.setSelectionRange) try { f.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  }
  window.__dcStart = function(Component){
    tpl = document.getElementById('tpl'); mount = document.getElementById('app');
    comp = new Component(); comp.props = {}; render();
    const fit = () => { const s = Math.min(1, (window.innerHeight - 24) / 844, (window.innerWidth - 16) / 390); document.getElementById('phone').style.transform = 'scale(' + s + ')'; };
    window.addEventListener('resize', fit); fit();
  };
})();
</script>
<script>

class Component extends DCLogic {
  state = {
    tab: 'odkrywaj', gmina: 'Cała Małopolska', typ: 'Wszystko', detail: null, inst: false,
    points: 340, toast: '', supported: {}, status1: 2, merged: false, mergeDecided: false,
    joined: {}, checked: {}, draft: '', mod: null,
    addText: 'Wieczorem przy szkole na Polnej jest kompletnie ciemno, dzieci wracają z zajęć po 17 poboczem.',
    analyzed: false, rodzaj: 'formalne', joinedDup: false,
    liga: 'Średnie', vote: null, sortBy: 'liczba',
    privacy: { imie: 0, nazwisko: 1, telefon: 2, email: 1 },
    comments: {
      z1: [
        { who: 'Marek, ul. Polna', type: 'Uwaga', up: 12, down: 0, text: 'Potwierdzam, od tygodnia nie działa też latarnia przy przystanku.' },
        { who: 'Kasia', type: 'Uwaga', up: 9, down: 1, text: 'Dodałam zdjęcie z 18:00. Kierowcy nie widzą dzieci na poboczu.' },
        { who: 'Tomasz, ul. Polna 14', type: 'Sprzeciw', up: 6, down: 11, text: 'Nie chcę latarni LED pod oknami sypialni. Oświetlmy tylko przejście i okolice szkoły.' },
        { who: 'Ela, Rada Rodziców', type: 'Propozycja', up: 18, down: 3, text: 'Zamiast 14 latarni: 6 przy szkole i przejściu plus wyniesione przejście dla pieszych. Taniej i bezpieczniej.' }
      ],
      z5: [ { who: 'Józef, Gdów', type: 'Uwaga', up: 22, down: 1, text: 'Do przychodni jest 9 km, a autobus jeździ dwa razy dziennie.' } ],
      z8: [ { who: 'Zarząd Dróg Miasta Tarnowa', text: 'Naprawa zaplanowana na 6 października.', official: true } ]
    }
  };

  flash(msg, pts) {
    this.setState({ toast: msg, points: this.state.points + (pts || 0) });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: '' }), 2600);
  }

  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    const s = this.state;
    const homeG = s.home || 'Bochnia';
    const chip = (on) => on ? 'chip chip-on' : 'chip';
    const lime = '#D4FF4F', grey = '#A3A39C';

    const gminyList = ['Cała Małopolska', 'Bochnia', 'Wieliczka', 'Nowy Targ', 'Tarnów'];
    const typyList = ['Wszystko', 'Zgłoszenia', 'Wydarzenia', 'Pomoc', 'Hobby'];
    const typMap = { 'Zgłoszenia': 'zgl', 'Wydarzenia': 'wyd', 'Pomoc': 'pom', 'Hobby': 'hob' };
    const colors = { zgl: '#FF7A45', wyd: '#D4FF4F', pom: '#8FB8FF', hob: '#E7C6FF' };

    const z1Count = s.merged ? 26 : 23;
    const z1People = 41 + (s.supported.z1 ? 1 : 0);
    const statuses = ['Zgłoszone', 'Zebrane poparcie', 'Analiza gminy', 'W realizacji', 'Zrealizowane'];

    const openD = (id) => () => this.setState({ detail: id, mod: null, draft: '' });
    const items = [
      { id: 'z1', kind: 'zgl', kindLabel: 'Zgłoszenie zbiorcze', gmina: 'Bochnia', big: String(z1Count), bigSub: 'zgłoszeń · +9 w tym tygodniu', title: 'Ciemno na ul. Polnej i przy szkole', meta: 'Do: Urząd Gminy Bochnia · ' + statuses[s.status1] },
      { id: 'e2', kind: 'wyd', kindLabel: 'Wydarzenie', gmina: 'Bochnia', big: 'SOB 11.10', bigSub: (s.joined.e2 ? 19 : 18) + '/30 osób · 10:00', title: 'Sprzątanie brzegu Raby', meta: 'Organizuje: Koło Wędkarskie Bochnia · worki i rękawice na miejscu' },
      { id: 'p3', kind: 'pom', kindLabel: 'Pomoc sąsiedzka', gmina: 'Wieliczka', big: 'POTRZEBA', bigSub: 'do 2 km od Ciebie', title: 'Zakupy dla pani Heleny z os. Niepodległości', meta: 'Raz w tygodniu, najlepiej w czwartek po południu' },
      { id: 'h4', kind: 'hob', kindLabel: 'Hobby', gmina: 'Nowy Targ', big: 'WT 18:00', bigSub: 'co tydzień · 7 osób', title: 'Szachy w Miejskiej Bibliotece', meta: 'Wszystkie poziomy, plansze na miejscu' },
      { id: 'z5', kind: 'zgl', kindLabel: 'Zgłoszenie zbiorcze', gmina: 'Wieliczka', big: '37', bigSub: 'zgłoszeń z 6 gmin', title: 'Brak autobusu do przychodni', meta: 'Do: Województwo Małopolskie · Analiza' },
      { id: 'e6', kind: 'wyd', kindLabel: 'Wydarzenie', gmina: 'Tarnów', big: 'NDZ 19.10', bigSub: (s.joined.e6 ? 43 : 42) + ' osób · 14:00', title: 'Festyn sąsiedzki na Mościcach', meta: 'Organizuje: Rada Osiedla Mościce' },
      { id: 'h7', kind: 'hob', kindLabel: 'Hobby', gmina: 'Nowy Targ', big: 'SOB 8:00', bigSub: 'nowa grupa · 3 osoby', title: 'Nordic walking nad Dunajcem', meta: 'Szukamy 2 osób do stałej grupy' },
      { id: 'z8', kind: 'zgl', kindLabel: 'Zgłoszenie', gmina: 'Tarnów', big: '4', bigSub: 'zgłoszenia · w realizacji', title: 'Dziura w chodniku przy ul. Kolejowej', meta: 'Do: Zarząd Dróg Miasta Tarnowa · W realizacji' }
    ];

    const feed = items
      .filter((it) => s.gmina === 'Cała Małopolska' || it.gmina === s.gmina)
      .filter((it) => s.typ === 'Wszystko' || it.kind === typMap[s.typ])
      .map((it) => {
        const out = Object.assign({}, it, { color: colors[it.kind], hasSecond: false, second: null, secondLabel: '' });
        if (it.kind === 'zgl') {
          out.ctaLabel = it.gmina === homeG ? 'Zobacz zgłoszenie' : 'Podgląd zgłoszenia'; out.ctaCls = 'btn btn-sec'; out.cta = openD(it.id); if (it.gmina !== homeG) out.meta = out.meta + ' · tylko podgląd';
        } else if (it.kind === 'wyd') {
          const j = !!s.joined[it.id], c = !!s.checked[it.id];
          out.ctaLabel = j ? 'Jesteś zapisany' : 'Dołączam';
          out.ctaCls = j ? 'btn btn-done' : 'btn btn-sec';
          out.cta = () => { this.setState({ joined: Object.assign({}, s.joined, { [it.id]: !j }) }); if (!j) this.flash('Zapisano. Check-in kodem QR na miejscu da +15 pkt.'); };
          out.hasSecond = j && !c;
          out.secondLabel = 'Check-in QR';
          out.second = () => { this.setState({ checked: Object.assign({}, s.checked, { [it.id]: true }) }); this.flash('Check-in potwierdzony · +15 pkt', 15); };
          if (c) { out.ctaLabel = 'Obecność potwierdzona'; }
        } else if (it.kind === 'pom') {

      supportCls: supported ? 'btn btn-done' : 'btn btn-pri',
      supportLabel: supported ? 'Popierasz to zgłoszenie' : 'Chcę to u nas · Popieram',
      toggleSupport: () => {
        const on = !supported;
        this.setState({ supported: Object.assign({}, s.supported, { [did]: on }) });
        this.flash(on ? 'Poparcie dodane · +1 pkt' : 'Poparcie wycofane', on ? 1 : -1);
      },
      comments: comments,
      commentCount: comments.length,
      cntProp: countType('Propozycja'), cntSprz: countType('Sprzeciw'), cntUwag: countType('Uwaga'),
      sortTopCls: chip((s.csort || 'top') === 'top'), sortNewCls: chip(s.csort === 'new'),
      sortTop: () => this.setState({ csort: 'top' }), sortNew: () => this.setState({ csort: 'new' }),
      ctypes: ['Propozycja', 'Sprzeciw', 'Uwaga'].map((t) => ({ name: t, cls: chip((s.ctype || 'Uwaga') === t), pick: () => this.setState({ ctype: t }) })),
      draftPlaceholder: (s.ctype || 'Uwaga') === 'Propozycja' ? 'Co proponujesz zamiast?' : ((s.ctype || 'Uwaga') === 'Sprzeciw' ? 'Z czym się nie zgadzasz i dlaczego?' : 'Napisz, co widzisz na miejscu…'),
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value, mod: null }),
      modBlock: s.mod === 'block',
      modWarn: s.mod === 'warn',
      sendComment: () => {
        const t = (s.draft || '').toLowerCase().trim();
        if (!t) return;
        if (/(idio|debil|kretyn|wynocha|śmieci|złodzie)/.test(t)) { this.setState({ mod: 'block' }); return; }
        if (/(żenada|zenada|beznadziej|kurde|banda|nieroby)/.test(t)) { this.setState({ mod: 'warn' }); return; }
        this.setState({ comments: addComment({ who: 'Anna K. (Ty)', type: s.ctype || 'Uwaga', up: 0, down: 0, text: s.draft }), draft: '', mod: null });
        this.flash('Komentarz opublikowany');
      },
      useSuggestion: () => { this.setState({ comments: addComment({ who: 'Anna K. (Ty)', type: s.ctype || 'Uwaga', up: 0, down: 0, text: 'Sprawa ciągnie się za długo. Prosimy o konkretny termin realizacji.' }), draft: '', mod: null }); this.flash('Komentarz opublikowany'); },
      publishAnyway: () => { this.setState({ comments: addComment({ who: 'Anna K. (Ty)', type: s.ctype || 'Uwaga', up: 0, down: 0, text: s.draft }), draft: '', mod: null }); this.flash('Komentarz opublikowany'); },
      appeal: () => { this.setState({ mod: null }); this.flash('Odwołanie trafiło do moderatora. Odpowiedź w ciągu 48 h.'); },

      ligi: Object.keys(ligiDef).map((k) => ({ name: k === 'Kraków' ? 'Liga Krakowa' : k + ' gminy', cls: chip(s.liga === k), pick: () => this.setState({ liga: k, vote: null }) })),
      ligaOpis: L.opis,
      rank: rank,
      leader: L.rows[0][0],
      opcje: opcje,

      level: levels[li][1],
      levelPct: levelPct,
      levelNext: next ? 'Jeszcze ' + (next[0] - s.points) + ' pkt do poziomu ' + next[1] : 'Najwyższy poziom',
      privacy: privacy,
      openInst: () => this.setState({ inst: true, detail: null }),

      closeInst: () => this.setState({ inst: false, tab: 'odkrywaj' }),
      showMerge: !s.mergeDecided,
      approveMerge: () => { this.setState({ merged: true, mergeDecided: true }); this.flash('Połączono · zgłoszenie zbiorcze ma teraz 26 zgłoszeń'); },
      rejectMerge: () => { this.setState({ mergeDecided: true }); this.flash('Zgłoszenia zostają osobno. Autorzy dostaną informację.'); },
      sortLiczbaCls: chip(s.sortBy === 'liczba'),
      sortTrendCls: chip(s.sortBy === 'trend'),
      sortLiczba: () => this.setState({ sortBy: 'liczba' }),
      sortTrend: () => this.setState({ sortBy: 'trend' }),
      tematy: tematy,
      instStatus: statuses[s.status1],
      takeUpLabel: s.status1 >= 3 ? 'Podjęte · budżet 210 000 zł' : 'Podejmujemy · zatwierdź budżet',
      takeUp: () => {
        if (s.status1 >= 3) return;
        const all = Object.assign({}, s.comments);
        all.z1 = (all.z1 || []).concat([{ who: 'Urząd Gminy Bochnia', text: 'Dziękujemy za zgłoszenia. Zlecamy montaż 14 latarni na ul. Polnej, realizacja do 30 listopada.', official: true }]);
        this.setState({ status1: 3, comments: all });
        this.flash('Status zmieniony. 41 osób dostało powiadomienie.');
      },
      markDone: () => { this.setState({ status1: 4 }); this.flash('Oznaczono jako zrealizowane. Autorzy dostaną prośbę o zdjęcie „po”.'); }
    };
  }
}

window.__dcStart(Component);
</script>
</body>
</html>
